schema_version: 1
support_atlas_id: u_legs_right_v1

object:
  id: u_legs
  mesh: generated/aprilcube_parts/u_legs/grasp_mesh.obj
  geometry_config: config/aprilcube_parts/u_legs.yaml

hand:
  side: right
  descriptor: dex3_rev1_right
  open_collision_mesh: third_party/GraspGenX/assets/x_grippers/dex3_rev1_right/coll_mesh.obj

proposals:
  raw_directory: artifacts/grasp_atlas/u_legs_v1/raw
  expected_count: 4096

supports:
  # The U is an axis-aligned 3x1x3 voxel solid. These are its six obvious
  # physical supports; no generic stable-pose inference is needed.
  orientations:
    - {table_up_object: "+X", label: left_outer_leg_down, symmetry_class: outer_leg_side}
    - {table_up_object: "-X", label: right_outer_leg_down, symmetry_class: outer_leg_side}
    - {table_up_object: "+Y", label: broad_minus_y_face_down, symmetry_class: broad_face}
    - {table_up_object: "-Y", label: broad_plus_y_face_down, symmetry_class: broad_face}
    - {table_up_object: "+Z", label: upright_on_leg_ends, symmetry_class: leg_ends}
    - {table_up_object: "-Z", label: inverted_on_hip_bridge, symmetry_class: hip_bridge}

geometric_gates:
  # The canonical GraspGenX contract approaches from negative local Z.
  pregrasp_offset_local_z_m: -0.10
  approach_corridor_step_m: 0.001
  # Numerical tolerance only; it is not permission to penetrate the table.
  table_penetration_tolerance_m: 0.000001
  semantic_surface_tolerance_m: 0.0005

outputs:
  artifact: artifacts/grasp_support/u_legs_right_v1/support_atlas.json
  report: docs/u_legs_support_conditioned_grasp_audit.md
  support_visual: docs/assets/u_legs_six_tabletop_supports.png
