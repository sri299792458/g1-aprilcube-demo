schema_version: 1
experiment_id: u_legs_right_broad_face_isaac_v1

support_atlas: artifacts/grasp_support/u_legs_right_v1/support_atlas.json
support_symmetry_class: broad_face

object:
  id: u_legs
  mesh: generated/aprilcube_parts/u_legs/grasp_mesh.obj
  mass_kg: 0.2112813226371547
  mass_status: provisional_volume_scaled

hand:
  side: right
  descriptor: dex3_rev1_right

physics:
  simulation_profile: viral_g1_43dof_92bf086
  fps: 200.0
  max_num_envs: 14
  env_spacing_m: 1.5
  contact_trace_mode: coarse
  contact_trace_max_points_per_pair: 1
  min_contact_groups: 2

supported_pickup:
  schema_version: 1
  table:
    # Large enough that no candidate can exploit a simulated table edge. The
    # support-atlas gate treated the tabletop as an infinite plane.
    size_m: [1.00, 1.00, 0.05]
    top_z_m: 0.0
    static_friction: 1.0
    dynamic_friction: 1.0
    restitution: 0.0
  timing_s:
    support_settle: 0.50
    approach: 1.00
    close_and_settle: 1.00
    lift: 4.00
    final_hold: 1.00
  lift_distance_m: 0.20
  pass_contract:
    min_final_object_contact_digit_groups: 2
    reject_any_hand_table_contact: true
    reject_object_table_contact_during_final_hold: true

capture:
  enabled: true
  fps: 8
  layout: sequential

outputs:
  artifacts_root: artifacts/grasp_support/u_legs_right_broad_face_isaac_v1
  report_json: artifacts/grasp_support/u_legs_right_broad_face_isaac_v1/report.json
  report_markdown: docs/u_legs_broad_face_supported_pickup.md
  video: docs/assets/dex3_u_broad_face_supported_pickup_all42.mp4
