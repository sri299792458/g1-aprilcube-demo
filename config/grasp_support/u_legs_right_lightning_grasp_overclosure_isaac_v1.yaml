schema_version: 1
experiment_id: u_legs_right_lightning_grasp_overclosure_isaac_v1

source:
  result_npz: artifacts/lightning_grasp/u_legs_dex3_right_exhaustive_seed20260729_large.npz
  broad_face_audit: artifacts/lightning_grasp/u_legs_broad_face_audit_large.json
  baseline_report: artifacts/lightning_grasp/u_legs_right_close_lift_isaac_v1/report.json
  selection: every final_geometry_eligible pair

execution:
  # q_contact alone has no residual squeeze under position control. Continue
  # each candidate's own open-to-contact motion by these fractions.
  overclosure_scales: [0.05, 0.10, 0.20, 0.35, 0.50]

object:
  id: u_legs
  mesh: generated/aprilcube_parts/u_legs/grasp_mesh.obj
  mass_kg: 0.2112813226371547
  mass_status: provisional_volume_scaled

hand:
  side: right
  descriptor: dex3_rev1_right

physics:
  simulation_profile: viral_g1_43dof_92bf086
  fps: 200.0
  max_num_envs: 20
  env_spacing_m: 1.5
  contact_trace_mode: coarse
  contact_trace_max_points_per_pair: 1
  min_contact_groups: 2

supported_pickup:
  schema_version: 1
  table:
    size_m: [1.00, 1.00, 0.05]
    top_z_m: 0.0
    static_friction: 1.0
    dynamic_friction: 1.0
    restitution: 0.0
  timing_s:
    support_settle: 0.50
    approach: 0.25
    close_and_settle: 1.00
    lift: 4.00
    final_hold: 1.00
  lift_distance_m: 0.20
  pass_contract:
    min_final_object_contact_digit_groups: 2
    reject_any_hand_table_contact: true
    reject_object_table_contact_during_final_hold: true

capture:
  enabled: true
  fps: 8
  layout: sequential

outputs:
  artifacts_root: artifacts/lightning_grasp/u_legs_right_overclosure_isaac_v1
  report_json: artifacts/lightning_grasp/u_legs_right_overclosure_isaac_v1/report.json
  report_markdown: docs/lightning_grasp_u_isaac_overclosure.md
  video: docs/assets/lightning_grasp_dex3_u_overclosure_isaac20.mp4
