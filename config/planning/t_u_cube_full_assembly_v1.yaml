schema_version: 1
scene_id: t_u_cube_full_assembly_v1

robot:
  model: generated/robot/g1_fixed_torso_dual_dex3.yml
  urdf: generated/robot/g1_fixed_torso_dual_dex3.urdf
  base_world_translation_m: [0.0, 0.0, 0.75]
  # Collision-checked seated ready state generated by exact current-Dex3 IK.
  # Both grasp frames are 32 cm above the table at x=0.30 m and y=+/-0.24 m,
  # keeping the hands and elbows clear of all three initial objects.
  start_arm_joint_positions: [-0.58092976, 0.65199596, 0.38743800,
                              0.04474050, -0.36370507, 0.71538401, -0.30216664,
                              -0.58512127, -0.62331915, -0.41847223,
                              0.04542468, 0.36965990, 0.73370647, 0.30281359]
  role_to_hand: {holder: left, worker: right}

table:
  # Same adjustable-table baseline already proven by the single-arm picks.
  center_world_m: [0.55, 0.0, 0.68]
  dimensions_m: [0.80, 0.80, 0.04]
  top_world_z_m: 0.70

fixtures:
  # Minimal locating peg for the 45 mm head cube. Its 20 mm height is the
  # measured minimum that yields shared tabletop-pick/head-mate candidates.
  head_support:
    center_world_m: [0.38, -0.32, 0.71]
    dimensions_m: [0.015, 0.015, 0.020]

parts:
  t_body:
    mesh: generated/aprilcube_parts/t_body/grasp_mesh.obj
    grasp_pool: artifacts/grasp_atlas/t_body_left_viral_v1/left/arm_grasp_pool.yaml
    initial_world_pose:
      # Upright on the 45 x 45 mm stem end. This exposes the central stem for
      # a lateral Dex3 grasp; a flat T would require open fingers below the
      # tabletop. The prepared demo pose only needs to remain stable until pick.
      translation: [0.40, 0.28, 0.79]
      rotation_axis_angle_deg: [1.0, 0.0, 0.0, 0.0]
  u_legs:
    mesh: generated/aprilcube_parts/u_legs/grasp_mesh.obj
    grasp_pool: artifacts/grasp_atlas/u_legs_viral_v1/right/arm_grasp_pool.yaml
    initial_world_pose:
      # Upright on the two 45 x 45 mm leg ends, leaving the hip connector and
      # both leg sides accessible without requiring fingers below the table.
      # This stable yaw has physics-qualified candidates that are reachable
      # both here and at the future inverted-U connector pose.
      translation: [0.36, -0.22, 0.7675]
      rotation_axis_angle_deg: [0.0, 0.0, 1.0, 0.0]
  cube_head:
    mesh: generated/aprilcube_parts/cube_head/grasp_mesh.obj
    grasp_pool: artifacts/grasp_atlas/cube_viral_v1/right/arm_grasp_pool.yaml
    initial_world_pose:
      translation: [0.38, -0.32, 0.7425]
      rotation_axis_angle_deg: [0.0, 0.0, 1.0, 0.0]

motion:
  candidate_goalset_size: 48
  pick_pregrasp_offset_local_z_m: -0.10
  worker_retreat_local_z_m: -0.075
  pregrasp_clearance_world_z_m: 0.15
  pick_retract_world_z_m: 0.10
  # U approaches upward from below; head approaches downward from above.
  mate_precontact_offsets_world_z_m:
    u_legs: -0.055
    cube_head: 0.055
  mate_transit_clearance_world_z_m: 0.05
  # Verified collision-free reveal clearance after releasing the assembly.
  retreat_world_z_m: 0.075
  holder_u_attach_t_world_pose:
    # Raising T gives the U 40 mm table clearance at its below-contact pose.
    translation: [0.42, 0.0, 1.02]
    rotation_axis_angle_deg: [1.0, 0.0, 0.0, 0.0]
  holder_upright_t_world_pose:
    translation: [0.42, 0.0, 0.95]
    rotation_axis_angle_deg: [1.0, 0.0, 0.0, 0.0]
  placed_t_world_pose:
    # Full assembly lower bound is T_z - 0.225 m. This leaves 3 mm clearance
    # before the final release and avoids planning into the tabletop surface.
    translation: [0.43, 0.06, 0.928]
    rotation_axis_angle_deg: [1.0, 0.0, 0.0, 0.0]

render:
  fps: 24
  hold_frames: 18
  camera_eye_world_m: [1.23, -1.23, 1.20]
  camera_target_world_m: [0.34, 0.0, 0.88]
  resolution: [960, 720]
  output_dir: artifacts/full_assembly/t_u_cube_v1
