schema_version: 1
shortlist_id_prefix: cube_tripod_right_v1
base_shortlist_config: config/grasp_shortlists/cube_right_executable_v1.yaml

fixture:
  mesh_units: millimeter
  cube_xy_m: [0.0, 0.0]
  cube_yaw_deg: 0.0
  variants:
    - id: h40
      support_height_m: 0.04
      mesh: hardware/fixtures/cube_tripod_presenter/cube_tripod_presenter_h40.stl
    - id: h50
      support_height_m: 0.05
      mesh: hardware/fixtures/cube_tripod_presenter/cube_tripod_presenter_h50.stl
    - id: h60
      support_height_m: 0.06
      mesh: hardware/fixtures/cube_tripod_presenter/cube_tripod_presenter_h60.stl

table:
  width_m: 0.60
  depth_m: 0.60
  collision_thickness_m: 0.02

execution_contract:
  # These are the three strategies already tried by the upstream cuRobo path.
  approach_distances_m: [0.15, 0.10, 0.07]
  closure_ccd_segments: 12
  ccd_max_iterations: 100
  ccd_time_of_contact_tolerance: 1.0e-6

output_root: artifacts/grasp_shortlists/cube_tripod_right_v1
